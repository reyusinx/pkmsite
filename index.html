<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>Pena & Kamp Imakris 2026 | Official Web</title>
    <!-- Tailwind + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=Wallpoet&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="parallax-bg"></div>

    <!-- LOADING -->
    <div id="loading">
      <div class="loader"></div>
      <p>MEMPERSIAPKAN</p>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content">
      <!-- HEADER (logo di tengah) -->
      <header class="header top-0 left-0 w-full z-50">
        <img src="image/logo.png" alt="Logo" class="logo-img" />
      </header>

      <!-- HERO SECTION -->
      <section class="hero-section">
        <!-- Floating elements -->
        <div class="float-wrap" data-speed="0.12">
          <img src="image/Element-1.png" alt="" class="float-element" />
        </div>
        <div class="float-wrap" data-speed="0.2">
          <img src="image/Element-1.png" alt="" class="float-element" />
        </div>
        <div class="float-wrap" data-speed="0.15">
          <img src="image/Element-1.png" alt="" class="float-element" />
        </div>
        <div class="float-wrap" data-speed="0.25">
          <img src="image/Element-1.png" alt="" class="float-element" />
        </div>
        <div class="float-wrap" data-speed="0.1">
          <img src="image/Element-1.png" alt="" class="float-element" />
        </div>

        <div class="hero-content">
          <div class="hero-img-wrap" id="heroImgWrap">
            <img src="image/herosectiontext.png" alt="Hero Text PKM" />
          </div>

          <!-- Social logos (rapat & naik) -->
          <div class="social-logos">
            <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="#" aria-label="Instagram"
              ><i class="fab fa-instagram"></i
            ></a>
            <a href="#" aria-label="WhatsApp"
              ><i class="fab fa-whatsapp"></i
            ></a>
          </div>
        </div>

        <!-- Scroll indicator -->
        <div
          class="absolute bottom-6 -translate-x-1/2 flex flex-col items-center gap-1 text-white/40 text-xs font-medium scroll-indicator"
        >
          <span>Scroll</span>
          <i class="fa-solid fa-chevron-down text-sm"></i>
        </div>
      </section>

      <!-- LINK SECTION -->
      <section id="links" class="px-5 pb-8 max-w-lg mx-auto">
        <div class="space-y-3.5">
          <a href="#" class="link-btn btn-instagram1" data-delay="0">
            <span class="btn-label">Instagram Imakris</span>
            <span class="chevron-right"
              ><i class="fa-solid fa-chevron-right"></i
            ></span>
          </a>

          <a href="#" class="link-btn btn-instagram2" data-delay="50">
            <span class="btn-label">Instagram PKM</span>
            <span class="chevron-right"
              ><i class="fa-solid fa-chevron-right"></i
            ></span>
          </a>

          <a href="#" class="link-btn btn-handbook" data-delay="100">
            <span class="btn-label">Handbook PKM</span>
            <span class="chevron-right"
              ><i class="fa-solid fa-chevron-right"></i
            ></span>
          </a>

          <a href="#" class="link-btn btn-twibbon" data-delay="150">
            <span class="btn-label">Twibbon</span>
            <span class="chevron-right"
              ><i class="fa-solid fa-chevron-right"></i
            ></span>
          </a>

          <a href="#" class="link-btn btn-contact" data-delay="200">
            <span class="btn-label">CONTACT PERSON PER-FAKULTAS</span>
            <span class="chevron-right"
              ><i class="fa-solid fa-chevron-right"></i
            ></span>
          </a>

          <a href="#" class="link-btn btn-theme" data-delay="250">
            <span class="btn-label">THEME SONG</span>
            <span class="chevron-right"
              ><i class="fa-solid fa-chevron-right"></i
            ></span>
          </a>

          <a href="#" class="link-btn btn-dokumentasi" data-delay="300">
            <span class="btn-label">DOKUMENTASI PKM</span>
            <span class="chevron-right"
              ><i class="fa-solid fa-chevron-right"></i
            ></span>
          </a>

          <a href="#" class="link-btn btn-kelompok" data-delay="350">
            <span class="btn-label">Pembagian kelompok</span>
            <span class="chevron-right"
              ><i class="fa-solid fa-chevron-right"></i
            ></span>
          </a>

          <a href="#" class="link-btn btn-kamar" data-delay="400">
            <span class="btn-label">Pembagian kamar</span>
            <span class="chevron-right"
              ><i class="fa-solid fa-chevron-right"></i
            ></span>
          </a>
        </div>
      </section>

      <!-- FOOTER -->
      <footer class="py-5 text-center text-xs">
        <p>&copy; 2026 Panitia PKM · All rights reserved.</p>
        <p class="mt-1 text-[11px] text-white/25">
          Made with <i class="fa-solid fa-heart heart"></i> &amp; Tailwind
        </p>
      </footer>
    </div>

    <script>
      (function () {
        "use strict";

        // LOADING
        const loading = document.getElementById("loading");
        setTimeout(() => {
          loading.classList.add("hide");
          setTimeout(initScrollReveal, 400);
        }, 2000);

        // SCROLL REVEAL
        function initScrollReveal() {
          const btns = document.querySelectorAll(".link-btn");
          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  const delay =
                    parseInt(entry.target.getAttribute("data-delay")) || 0;
                  setTimeout(() => {
                    entry.target.classList.add("visible");
                  }, delay);
                  observer.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.15, rootMargin: "0px 0px -30px 0px" },
          );
          btns.forEach((btn) => observer.observe(btn));
        }

        // FALLBACK
        setTimeout(() => {
          document
            .querySelectorAll(".link-btn:not(.visible)")
            .forEach((btn) => {
              btn.classList.add("visible");
            });
        }, 4000);

        // PARALLAX
        const prefersReducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        if (!prefersReducedMotion) {
          const bgLayer = document.getElementById("parallax-bg");
          const heroImgWrap = document.getElementById("heroImgWrap");
          const floatWraps = document.querySelectorAll(".float-wrap");
          let ticking = false;

          function updateParallax() {
            const scrolled = window.scrollY;
            if (bgLayer)
              bgLayer.style.transform = `translateY(${scrolled * 0.15}px)`;
            if (heroImgWrap)
              heroImgWrap.style.transform = `translateY(${scrolled * 0.08}px)`;
            floatWraps.forEach((el) => {
              const speed = parseFloat(el.dataset.speed) || 0.15;
              el.style.transform = `translateY(${scrolled * speed}px)`;
            });
            ticking = false;
          }

          window.addEventListener(
            "scroll",
            () => {
              if (!ticking) {
                requestAnimationFrame(updateParallax);
                ticking = true;
              }
            },
            { passive: true },
          );

          updateParallax();
        }
      })();
    </script>
  </body>
</html>
